apiVersion: v2
name: audiobookshelf
description: Audiobookshelf — self-hosted audiobook and podcast server. bjw-s app-template baseline.
type: application
version: 1.0.0
appVersion: "latest"
kubeVersion: ">=1.28.0-0"
home: https://www.audiobookshelf.org
keywords:
  - audiobookshelf
  - audiobooks
  - podcasts
  - bjw-s
  - app-template
sources:
  - https://github.com/advplyr/audiobookshelf
  - https://github.com/bjw-s/helm-charts
maintainers: []
dependencies:
  - name: app-template
    version: "4.6.2"
    repository: https://bjw-s-labs.github.io/helm-charts
    alias: audiobookshelf
  - name: onepassworditem
    version: "1.1.1"
    repository: https://expectedbehaviors.github.io/OnePasswordItem-helm
